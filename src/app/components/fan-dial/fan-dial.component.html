<div
  class="dial"
  role="slider"
  aria-label="Velocidad del ventilador"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-valuenow]="preview"
  [attr.aria-valuetext]="
    preview + ' por ciento'
  "
  [attr.aria-disabled]="disabled"
  [attr.tabindex]="
    disabled ? -1 : 0
  "
  [class.disabled]="disabled"
  (pointerdown)="start($event)"
  (pointermove)="move($event)"
  (pointerup)="finish($event)"
  (pointercancel)="cancel()"
  (lostpointercapture)="cancel()"
  (keydown)="key($event)"
>

  <svg
    viewBox="0 0 200 200"
    aria-hidden="true"
  >

    <circle
      class="track"
      cx="100"
      cy="100"
      r="78"
    >
    </circle>


    <circle
      class="progress"
      cx="100"
      cy="100"
      r="78"
      pathLength="100"
      [attr.stroke-dasharray]="
        (preview * 0.75) + ' 100'
      "
      transform="rotate(135 100 100)"
    >
    </circle>


    <circle
      class="face"
      cx="100"
      cy="100"
      r="60"
    >
    </circle>


    <g
      [attr.transform]="
        'rotate(' +
        (-135 + preview * 2.7) +
        ' 100 100)'
      "
    >

      <line
        x1="100"
        y1="50"
        x2="100"
        y2="61"
      >
      </line>

    </g>

  </svg>


  <span class="number">

    {{ preview }}

    <small>
      %
    </small>

  </span>

</div>


<p class="hint">
  Gira y suelta · flechas para ajustar
</p>
